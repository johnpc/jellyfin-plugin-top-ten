name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest.json"
      - "**.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore jellyfin-plugin-top-ten.sln

    - name: Check formatting
      run: dotnet format jellyfin-plugin-top-ten.sln --verify-no-changes

    - name: Build (strict)
      run: dotnet build jellyfin-plugin-top-ten.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run unit tests with coverage
      run: |
        dotnet test Jellyfin.Plugin.TopTen.Tests/Jellyfin.Plugin.TopTen.Tests.csproj \
          --configuration Release \
          --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=json \
          /p:CoverletOutput=../coverage/coverage.json \
          /p:Include="[Jellyfin.Plugin.TopTen]*" \
          /p:ThresholdType=line \
          /p:Threshold=80

    - name: Run acceptance tests
      run: |
        dotnet test Jellyfin.Plugin.TopTen.AcceptanceTests/Jellyfin.Plugin.TopTen.AcceptanceTests.csproj \
          --configuration Release \
          --no-build

    - name: CRAP score check
      run: bash scripts/check-crap.sh coverage/coverage.json

  release:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get next version
      id: get_version
      run: |
        LATEST=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')
        if [ -z "$LATEST" ]; then
          LATEST="0.0.0.0"
        fi
        NEXT=$(echo "$LATEST" | awk -F. '{$NF=$NF+1; print}' OFS=.)
        echo "VERSION=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.TopTen/Jellyfin.Plugin.TopTen.csproj

    - name: Build release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        dotnet build Jellyfin.Plugin.TopTen/Jellyfin.Plugin.TopTen.csproj --configuration Release --no-restore \
          /p:TreatWarningsAsErrors=true \
          /p:Version=$VERSION \
          /p:AssemblyVersion=$VERSION \
          /p:FileVersion=$VERSION

    - name: Create release zip
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release
        find Jellyfin.Plugin.TopTen -path "*/bin/Release/net10.0/*.dll" -exec cp {} release/ \;
        cd release
        zip -r ../jellyfin-plugin-top-ten-${VERSION}.zip .

    - name: Update manifest.json (accumulate, git is source of truth)
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/update-manifest.py \
          --version "$VERSION" \
          --zip "jellyfin-plugin-top-ten-${VERSION}.zip" \
          --repo "${{ github.repository }}"

    - name: Validate manifest.json
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/validate-manifest.py \
          --new-version "$VERSION" \
          --zip "jellyfin-plugin-top-ten-${VERSION}.zip"

    - name: Create tag and GitHub Release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION"
        git push origin "$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        files: |
          jellyfin-plugin-top-ten-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify published release asset matches manifest
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        SOURCE_URL=$(jq -r '.[0].versions[0].sourceUrl' manifest.json)
        EXPECTED=$(jq -r '.[0].versions[0].checksum' manifest.json)
        echo "Verifying $SOURCE_URL against manifest checksum $EXPECTED"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL -o published.zip "$SOURCE_URL"; then
            break
          fi
          echo "Download attempt $attempt failed; retrying in 10s..."
          sleep 10
          if [ "$attempt" = "5" ]; then
            echo "ERROR: could not download published asset"
            exit 1
          fi
        done
        ACTUAL=$(md5sum published.zip | awk '{ print $1 }')
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "ERROR: published asset md5 ($ACTUAL) does not match manifest checksum ($EXPECTED)"
          exit 1
        fi
        echo "Published asset verified: md5 $ACTUAL"

    - name: Update manifest on main
      run: |
        git fetch origin main
        git checkout main
        git add manifest.json
        git diff --cached --quiet || git commit -m "chore: update manifest for ${{ steps.get_version.outputs.VERSION }}"
        git push origin main
