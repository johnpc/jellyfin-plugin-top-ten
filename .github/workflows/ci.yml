name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore jellyfin-plugin-top-ten.sln

    - name: Check formatting
      run: dotnet format jellyfin-plugin-top-ten.sln --verify-no-changes

    - name: Build (strict — catches deprecated APIs, unused vars, naming violations)
      run: dotnet build jellyfin-plugin-top-ten.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run unit tests with coverage
      run: |
        dotnet test Jellyfin.Plugin.TopTen.Tests/Jellyfin.Plugin.TopTen.Tests.csproj \
          --configuration Release \
          --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=json \
          /p:CoverletOutput=../coverage/coverage.json \
          /p:Include="[Jellyfin.Plugin.TopTen]*" \
          /p:ThresholdType=line \
          /p:Threshold=80

    - name: Run acceptance tests
      run: |
        dotnet test Jellyfin.Plugin.TopTen.AcceptanceTests/Jellyfin.Plugin.TopTen.AcceptanceTests.csproj \
          --configuration Release \
          --no-build

    - name: CRAP score check
      run: bash scripts/check-crap.sh coverage/coverage.json
